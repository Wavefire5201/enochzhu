<!doctype html>
<!-- ack -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Pick once, before first paint, so the poster and WebGL layer share the
			// same refresh-scoped image. Selected on every page — the 404/fog pages
			// rotate through the same pool as the hero. Avoid an immediate repeat.
			document.documentElement.classList.add("js");
			const pairs = ["fog-forest", "mountain", "forest-road", "rain-city"];
			let previous = null;
			try {
				previous = sessionStorage.getItem("hero-pair");
			} catch {}
			const choices = pairs.filter((id) => id !== previous);
			const selected = choices[Math.floor(Math.random() * choices.length)];
			document.documentElement.dataset.heroPair = selected;
			try {
				sessionStorage.setItem("hero-pair", selected);
			} catch {}

			// Preload only where the backdrop is certain to render — content pages
			// must not pay for an image they never show.
			if (location.pathname === "/") {
				// Start the exact selected poster while the body is still being parsed.
				const preload = document.createElement("link");
				preload.rel = "preload";
				preload.as = "image";
				preload.imageSrcset = `/hero/${selected}-poster-800.webp 800w, /hero/${selected}-poster-1600.webp 1600w`;
				preload.imageSizes = "100vw";
				preload.fetchPriority = "high";
				document.head.append(preload);
			}
		</script>
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#0c110e" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
